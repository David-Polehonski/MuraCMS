# nginx server block for Mura CMS on the lucee/lucee "-nginx" image.
#
# This replaces the stock /etc/nginx/conf.d/default.conf shipped by the base
# image (see https://github.com/lucee/lucee-dockerfiles nginx/default.conf).
# It keeps that file's Lucee-admin / internals blocking rules and its
# location @lucee proxy block verbatim, and turns on the front-controller
# rewrite that file leaves commented out as an example - the same behaviour
# Mura's own htaccess.txt (mod_rewrite) and core/docker/build/urlrewrite.xml
# (Tuckey, for the plain Tomcat image) provide: any request that isn't a real
# file or directory is handed to /index.cfm as PATH_INFO.

upstream tomcat_backend {
  server 127.0.0.1:8888;

  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;
  index index.cfm index.html index.htm;
  root /var/www;
  server_name_in_redirect off;

  # Mura's asset manager / ckfinder uploads can be large.
  client_max_body_size 100m;

  # Never serve, proxy, or rewrite to Lucee/Tomcat/Mura internals.
  #
  # Every pattern below is anchored to a full path segment (^/name(/|$)) and
  # escapes its dots. The obvious-looking unanchored forms (`~* ^/lucee`,
  # `~* /CFIDE`, `~* Application.cf[mc]$`) are substring matches, so they also
  # swallow ordinary Mura content URLs that merely start with or contain those
  # letters - e.g. a page whose filename is "lucee-6-upgrade" or
  # "cfide-explained" would 404 at the edge and never reach the front
  # controller. Anchoring keeps the internals blocked without eating content.
  location ~* /Application\.cf[mc]$ {
    return 404;
  }
  location ~* /Web\.cfc$ {
    return 404;
  }
  location ~* ^/lucee-server(/|$) {
    return 404;
  }
  location ~* ^/CFIDE(/|$) {
    return 404;
  }
  location ~* ^/WEB-INF(/|$) {
    return 404;
  }
  # Lucee admin (and its cfchart renderer at /lucee/graph.cfm) - disabled by
  # default; the base image already blocks these, repeated here so it survives
  # us replacing the whole server block.
  location ~* ^/lucee(/|$) {
    return 404;
  }

  # Mura front controller: serve real files/directories (css, js, images,
  # site assets...) as-is; everything else falls through to index.cfm with
  # the original URI as PATH_INFO, query string preserved.
  location / {
    try_files $uri $uri/ /index.cfm$uri?$args;
  }

  location ~* \.(cfm$|cfc$|cfm/) {
    try_files @lucee @lucee;
  }

  location @lucee {
    proxy_pass http://tomcat_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
  }
}
